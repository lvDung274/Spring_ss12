spring.application.name=btth-session12

# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_sesion12
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Cấu hình log
logging.file.name=loggings/logging.log
logging.file.path=loggings
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p

#Thong số giới hnaj dung lượng của một file
logging.logback.rollingpolicy.max-file-size=10MB
#Giới hạn file tồn tại trong bao lâu
logging.logback.rollingpolicy.max-history=7

#Chuyen doi cau hinh sang moi truoing prod
spring.profiles.active=prod
